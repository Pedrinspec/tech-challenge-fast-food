spring:
  application:
    name: fast-food-tc

  datasource:
    url: jdbc:mysql://localhost:3306/fastfoodtc
    username: root
    password: admin

  jpa:
    hibernate:
        ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  redis:
    host: localhost
    port: 6379

server:
  port: 8080
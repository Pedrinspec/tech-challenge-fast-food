spring:
  application:
    name: fast-food-tc

  datasource:
    url: jdbc:mysql://localhost:3306/fastfoodtc    # #usado para localhost normal
#    url: jdbc:mysql://db:3306/fastfoodtc #usado para docker
    username: root
    password: admin
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
        ddl-auto: drop-and-create
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  redis:
    host: localhost
    port: 6379

server:
  port: 8080
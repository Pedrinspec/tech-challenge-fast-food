name: Java CI 
on:
  push:
    branches: 
      - "develop"
      - "feature/health-check"
  pull_request:
    branches: 
      - "develop"
      - "feature/health-check"

jobs:
  build-test-and-docker:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: gustavohaj/fastfood-app

    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: ✅ Permissão para gradlew
        run: chmod +x gradlew

      - name: 🧪 Build e testes com Gradle
        run: ./gradlew build --no-daemon --stacktrace

      - name: 🔐 Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🐳 Build e push da imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest

  confirmar-cd:
    name: Confirmar para seguir para o CD
    needs: build-test-and-docker
    runs-on: ubuntu-latest
    environment: 
      name: Confirmar-Deploy
    steps:
      - name: 🚀 Disparar Workflow de CD no repositório de Infra
        uses: benc-uk/workflow-dispatch@v1
        with:
          # O nome do arquivo do workflow orquestrador no outro repositório
          workflow: ci-trigger-handler.yml
          # O token com permissão para acionar actions em outros repositórios
          token: ${{ secrets.ACTIONS_PAT }}
          # O repositório de destino (CD/Infra)
          repo: gustavohaj/tech-challenge-fast-food-Infra
          # A branch onde o workflow se encontra
          ref: main # ou a branch principal do seu repositório de infra
name: CI Pipeline

on:
  push:
    branches: [ "continuosIntegration" ]
  pull_request:
    branches: [ "continuosIntegration" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          architecture: 'x64'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4.2'
          distribution: 'bin'

      - name: Build with Gradle
        run: ./gradlew -b ci.gradle build

